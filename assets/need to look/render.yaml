# render.yaml — Docker blueprint (no startCommand)
services:
  - type: web
    name: pashudrishti
    env: docker
    region: oregon
    branch: main
    plan: free

    dockerfilePath: Dockerfile

    envVars:
      - key: MODEL_PATH
        value: best_model_final.pth
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite

    healthCheckPath: /health
